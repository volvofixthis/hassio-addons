---
configuration:
  mount_unlabeled:
    name: Mount Unlabeled Drives
    description:  >- 
      Also mount external drives that have no filesystem label (default: false)
  automount_on_plugin:
    name: Auto-mount on Plugin
    description: >-
      Automatically mount drives when they are plugged in (default: true)
  specific_label:
    name: Specific Label
    description: >-
      If set, only mount this specific drive label at startup and on hot-plug.
      Leave empty to mount all labeled drives (default: empty)
  mount_location:
    name: Mount Location
    description: >-
      HA storage location to use: media, share, or backup. With network storage enabled this controls HA exposure;
      when disabled, drives mount directly under /media, /share, or /backup (default: media)
  expose_network_storage:
    name: Expose as Network Storage
    description: >-
      Expose mounted drives to Home Assistant as network storage and start the internal Samba server.
      Disable this to mount drives directly under the selected mount location without Samba or HA registration (default: true)
  hdd_idle_seconds:
    name: HDD Idle Power-Down
    description: >-
      Spin down external hard drives after N seconds of inactivity. Set to 0 to disable (default: 0)
  file_activity_detail:
    name: File Activity Detail
    description: >-
      Choose "off" to disable file activity logging. "basic" logs connections,
      file opens/creates, deletes, renames, and new folders. "detailed" also logs
      closes, truncations, permission and attribute changes, and every individual
      read and write (default: off).
  folder_mounts:
    name: Folder Mounts (Advanced)
    description: >-
      Map specific folders within mounted drives to different HA storage locations.
      Drives must be mounted first. Ignored when network storage exposure is disabled.
    fields:
      name:
        name: Name (optional)
        description: >-
          The name shown in Network Storage. Use only letters, numbers, and underscores.
          Leave empty to use the default drive-and-folder name.
      drive:
        name: Drive Label
        description: >-
          Label of an already-mounted drive
      folder:
        name: Folder Path
        description: >-
          Relative path within the drive
      location:
        name: HA Storage Location
        description: >-
          Where to expose this folder: media, share, or backup
